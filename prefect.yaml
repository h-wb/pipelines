name: dlt
prefect-version: 3.7.3
definitions:
  work_pools:
    default_work_pool: &default_work_pool
      name: local-pool
      work_queue_name: default
  base_env: &base_env
    RUNTIME__LOG_LEVEL: "{{ $RUNTIME__LOG_LEVEL }}"
    PREFECT_LOGGING_EXTRA_LOGGERS: "{{ $PREFECT_LOGGING_EXTRA_LOGGERS }}"
    PREFECT_LOGGING_LOG_PRINTS: "{{ $PREFECT_LOGGING_LOG_PRINTS }}"
    DESTINATION__POSTGRES__CREDENTIALS__HOST: "{{ $DESTINATION__POSTGRES__CREDENTIALS__HOST }}"
    DESTINATION__POSTGRES__CREDENTIALS__PORT: "{{ $DESTINATION__POSTGRES__CREDENTIALS__PORT }}"
    DESTINATION__POSTGRES__CREDENTIALS__DATABASE: "{{ $DESTINATION__POSTGRES__CREDENTIALS__DATABASE }}"
    DESTINATION__POSTGRES__CREDENTIALS__USERNAME: "{{ $DESTINATION__POSTGRES__CREDENTIALS__USERNAME }}"
    DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: "{{ $DESTINATION__POSTGRES__CREDENTIALS__PASSWORD }}"

pull:
- prefect.deployments.steps.git_clone:
    id: clone-step
    repository: https://github.com/h-wb/pipelines.git
    branch: main
- prefect.deployments.steps.run_shell_script:
    directory: '{{ clone-step.directory }}'
    script: uv pip install .

deployments:
- name: load_listenbrainz
  version: null
  tags: []
  description: null
  schedule:
    cron: '0 0 * * *'
  flow_name: load_listenbrainz
  entrypoint: src/pipelines/listenbrainz.py:load_listenbrainz
  parameters: {}
  work_pool:
    <<: *default_work_pool
    job_variables:
      env:
        <<: *base_env
        LISTENBRAINZ__USERNAME: "{{ $LISTENBRAINZ__USERNAME }}"
        LISTENBRAINZ__ACCESS_TOKEN: "{{ $LISTENBRAINZ__ACCESS_TOKEN }}"
        LISTENBRAINZ__START_DATE: "{{ $LISTENBRAINZ__START_DATE }}"

- name: load_apple_health
  version: null
  tags: []
  description: null
  schedule:
    cron: '0 * * * *'
  flow_name: load_apple_health
  entrypoint: src/pipelines/apple_health.py:load_apple_health
  parameters: {}
  work_pool:
    <<: *default_work_pool
    job_variables:
      env:
        <<: *base_env
        APPLE_HEALTH__DATA_DIR: "{{ $APPLE_HEALTH__DATA_DIR }}"

- name: load_bikeshare
  version: null
  tags: []
  description: null
  schedule:
    cron: '0 0 * * *'
  flow_name: load_bikeshare
  entrypoint: src/pipelines/bikeshare.py:load_bikeshare
  parameters: {}
  work_pool:
    <<: *default_work_pool
    job_variables:
      env:
        <<: *base_env
        BIKESHARE__MEMBER_ID: "{{ $BIKESHARE__MEMBER_ID }}"
        BIKESHARE__AUTHORIZATION_TOKEN: "{{ $BIKESHARE__AUTHORIZATION_TOKEN }}"