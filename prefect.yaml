name: dlt
prefect-version: 3.8.6
definitions:
  work_pools:
    default_work_pool: &default_work_pool
      name: local-pool
      work_queue_name: default
  base_env: &base_env
    RUNTIME__LOG_LEVEL: "{{ $RUNTIME__LOG_LEVEL }}"
    PREFECT_LOGGING_EXTRA_LOGGERS: "{{ $PREFECT_LOGGING_EXTRA_LOGGERS }}"
    PREFECT_LOGGING_LOG_PRINTS: "{{ $PREFECT_LOGGING_LOG_PRINTS }}"
    DESTINATION__POSTGRES__CREDENTIALS__HOST: "{{ $DESTINATION__POSTGRES__CREDENTIALS__HOST }}"
    DESTINATION__POSTGRES__CREDENTIALS__PORT: "{{ $DESTINATION__POSTGRES__CREDENTIALS__PORT }}"
    DESTINATION__POSTGRES__CREDENTIALS__DATABASE: "{{ $DESTINATION__POSTGRES__CREDENTIALS__DATABASE }}"
    DESTINATION__POSTGRES__CREDENTIALS__USERNAME: "{{ $DESTINATION__POSTGRES__CREDENTIALS__USERNAME }}"
    DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: "{{ $DESTINATION__POSTGRES__CREDENTIALS__PASSWORD }}"
    # every flow runs dbt now, and the github models read this
    GITHUB__AUTHOR_EMAILS: "{{ $GITHUB__AUTHOR_EMAILS }}"

pull:
- prefect.deployments.steps.git_clone:
    id: clone-step
    repository: https://github.com/h-wb/pipelines.git
    branch: main
- prefect.deployments.steps.run_shell_script:
    directory: '{{ clone-step.directory }}'
    script: uv pip install .

deployments:
- name: run_dbt
  version: null
  tags: []
  description: null
  schedule:
    cron: '0 3 * * *'
  flow_name: run_dbt
  entrypoint: src/pipelines/transform.py:run_dbt
  parameters: {}
  work_pool:
    <<: *default_work_pool
    job_variables:
      env:
        <<: *base_env
