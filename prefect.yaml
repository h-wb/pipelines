name: dlt
prefect-version: 3.8.6
definitions:
  work_pools:
    default_work_pool: &default_work_pool
      name: local-pool
      work_queue_name: default
  base_env: &base_env
    RUNTIME__LOG_LEVEL: "{{ $RUNTIME__LOG_LEVEL }}"
    PREFECT_LOGGING_EXTRA_LOGGERS: "{{ $PREFECT_LOGGING_EXTRA_LOGGERS }}"
    PREFECT_LOGGING_LOG_PRINTS: "{{ $PREFECT_LOGGING_LOG_PRINTS }}"
    DESTINATION__POSTGRES__CREDENTIALS__HOST: "{{ $DESTINATION__POSTGRES__CREDENTIALS__HOST }}"
    DESTINATION__POSTGRES__CREDENTIALS__PORT: "{{ $DESTINATION__POSTGRES__CREDENTIALS__PORT }}"
    DESTINATION__POSTGRES__CREDENTIALS__DATABASE: "{{ $DESTINATION__POSTGRES__CREDENTIALS__DATABASE }}"
    DESTINATION__POSTGRES__CREDENTIALS__USERNAME: "{{ $DESTINATION__POSTGRES__CREDENTIALS__USERNAME }}"
    DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: "{{ $DESTINATION__POSTGRES__CREDENTIALS__PASSWORD }}"

pull:
- prefect.deployments.steps.git_clone:
    id: clone-step
    repository: https://github.com/h-wb/pipelines.git
    branch: main
- prefect.deployments.steps.run_shell_script:
    directory: '{{ clone-step.directory }}'
    script: uv pip install .

deployments:
- name: load_listenbrainz
  version: null
  tags: []
  description: null
  schedule:
    cron: '0 0 * * *'
  flow_name: load_listenbrainz
  entrypoint: src/pipelines/listenbrainz.py:load_listenbrainz
  parameters: {}
  work_pool:
    <<: *default_work_pool
    job_variables:
      env:
        <<: *base_env
        LISTENBRAINZ__USERNAME: "{{ $LISTENBRAINZ__USERNAME }}"
        LISTENBRAINZ__ACCESS_TOKEN: "{{ $LISTENBRAINZ__ACCESS_TOKEN }}"
        LISTENBRAINZ__START_DATE: "{{ $LISTENBRAINZ__START_DATE }}"

- name: load_apple_health
  version: null
  tags: []
  description: null
  schedule:
    cron: '0 0 * * 0'
  flow_name: load_apple_health
  entrypoint: src/pipelines/apple_health.py:load_apple_health
  parameters: {}
  work_pool:
    <<: *default_work_pool
    job_variables:
      env:
        <<: *base_env
        APPLE_HEALTH__DATA_DIR: "{{ $APPLE_HEALTH__DATA_DIR }}"
        APPLE_HEALTH__CUTOFF: "{{ $APPLE_HEALTH__CUTOFF }}"

- name: run_dbt
  version: null
  tags: []
  description: null
  schedule:
    cron: '0 3 * * *'
  flow_name: run_dbt
  entrypoint: src/pipelines/transform.py:run_dbt
  parameters: {}
  work_pool:
    <<: *default_work_pool
    job_variables:
      env:
        <<: *base_env
        GITHUB__AUTHOR_EMAILS: "{{ $GITHUB__AUTHOR_EMAILS }}"

- name: load_bikeshare
  version: null
  tags: []
  description: null
  schedule:
    cron: '0 0 * * *'
  flow_name: load_bikeshare
  entrypoint: src/pipelines/bikeshare.py:load_bikeshare
  parameters: {}
  work_pool:
    <<: *default_work_pool
    job_variables:
      env:
        <<: *base_env
        BIKESHARE__MEMBER_ID: "{{ $BIKESHARE__MEMBER_ID }}"
        BIKESHARE__AUTHORIZATION_TOKEN: "{{ $BIKESHARE__AUTHORIZATION_TOKEN }}"

- name: load_github
  version: null
  tags: []
  description: null
  schedule:
    cron: '0 1 * * *'
  flow_name: load_github
  entrypoint: src/pipelines/github.py:load_github
  parameters: {}
  work_pool:
    <<: *default_work_pool
    job_variables:
      env:
        <<: *base_env
        GITHUB__USERNAME: "{{ $GITHUB__USERNAME }}"
        GITHUB__ACCESS_TOKEN: "{{ $GITHUB__ACCESS_TOKEN }}"

- name: load_browser_history
  version: null
  tags: []
  description: null
  schedule:
    cron: '0 2 * * *'
  flow_name: load_browser_history
  entrypoint: src/pipelines/browser_history.py:load_browser_history
  parameters: {}
  work_pool:
    <<: *default_work_pool
    job_variables:
      env:
        <<: *base_env
        BROWSER_HISTORY__DATA_DIR: "{{ $BROWSER_HISTORY__DATA_DIR }}"
