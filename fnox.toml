# fnox secret map for the dlt pipelines. Contains only ProtonPass references
# (no secret values), so it is safe to commit.
#
# mise injects only the keys granted by each task's `secrets = [...]` list
# (see mise.toml). Nothing is loaded into the activated shell. Non-secret config
# (usernames, start dates, hosts, log levels) lives in mise.toml; machine
# overrides belong in gitignored mise.local.toml. No mise environment switch
# is needed: the machine keeps its pod/paseo or workstation layers.
#
# Auth uses the repo-scoped pass-cli session: `mise run pass:login`.
# Workstations read pass-cli-dlt from the macOS Keychain; Paseo uses
# PROTON_PASS_TOKEN from the pod environment. See mise.toml for the session dir.
# One-off commands: `mise x --secrets KEY -- <command>`.
#
# Vaults: source tokens in `Automation` (provider `automation`); operator
# copies of infrastructure credentials in `Infrastructure` (provider `infra`).
# Existing Prefect/warehouse items were moved and verified on 2026-11-03.
# Permanent workstation/pod tokens need viewer grants on the new locations.

[providers.infra]
type = "proton-pass"
vault = "Infrastructure"
agent_reason = "dlt fnox"

[providers.automation]
type = "proton-pass"
vault = "Automation"
agent_reason = "dlt fnox"

[secrets]
LISTENBRAINZ__ACCESS_TOKEN     = { provider = "automation", value = "pass://Automation/listenbrainz/access-token" }
BIKESHARE__MEMBER_ID           = { provider = "automation", value = "pass://Automation/bikeshare/member-id" }
BIKESHARE__AUTHORIZATION_TOKEN = { provider = "automation", value = "pass://Automation/bikeshare/authorization-token" }
GITHUB__ACCESS_TOKEN           = { provider = "automation", value = "pass://Automation/github-pipelines/access-token" }
# JSON list of commit author emails that are "mine" (kept out of this public repo)
GITHUB__AUTHOR_EMAILS          = { provider = "automation", value = "pass://Automation/github-pipelines/author-emails" }

# Operator copies of infrastructure credentials live in `Infrastructure` (the
# infrastructure vault). These mirror the cluster's authoritative sources —
# BWS items `prefect` and `miroir`, CNPG secrets `postgres-metabase-app` and
# `postgres-miroir-app` — and stay until operator tasks read those sources
# directly. Warehouse and Prefect credentials are granted only to tasks that
# need them.
DESTINATION__POSTGRES__CREDENTIALS__PASSWORD = { provider = "infra", value = "pass://Infrastructure/postgres-metabase/password" }
PREFECT_API_URL                              = { provider = "infra", value = "pass://Infrastructure/prefect/api-url" }
PREFECT_API_AUTH_STRING                      = { provider = "infra", value = "pass://Infrastructure/prefect/api-auth-string" }
# Provisioning prerequisite: Infrastructure/miroir is not populated yet. Copy
# the existing installation key from BWS and metadata password from CNPG; never
# generate a replacement key for an existing encrypted installation.
# Miroir metadata database (schema miroir_meta in the postgres-miroir CNPG
# cluster, decision 015). In the cluster, flow-run Jobs read the password from
# the CNPG-generated postgres-miroir-app secret; this ProtonPass item holds the
# same app-user password for the operator's laptop (create it from the cluster
# secret after bootstrap). The miroir master key is granted only to tasks that
# decrypt built-in secrets.
MIROIR_METADATA__PASSWORD                     = { provider = "infra", value = "pass://Infrastructure/miroir/metadata-password" }
MIROIR_SECRET_KEY                            = { provider = "infra", value = "pass://Infrastructure/miroir/secret-key" }

