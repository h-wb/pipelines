# fnox secret map for the dlt pipelines. Contains only ProtonPass references
# (no secret values), so it is safe to commit.
#
# mise injects only the keys granted by each task's `secrets = [...]` list
# (see mise.toml). Nothing is loaded into the activated shell. Non-secret config
# (usernames, start dates, hosts, log levels) lives in mise.toml; machine
# overrides belong in gitignored mise.local.toml. No mise environment switch
# is needed: the machine keeps its pod/paseo or workstation layers.
#
# Auth uses the repo-scoped pass-cli session: `mise run pass:login`.
# Workstations read pass-cli-dlt from the macOS Keychain; Paseo uses
# PROTON_PASS_TOKEN from the pod environment. See mise.toml for the session dir.
# One-off commands: `mise x --secrets KEY -- <command>`.

[providers.protonpass]
type = "proton-pass"
vault = "env-dlt"
agent_reason = "dlt fnox"

[secrets]
LISTENBRAINZ__ACCESS_TOKEN     = { provider = "protonpass", value = "pass://env-dlt/listenbrainz/access-token" }
BIKESHARE__MEMBER_ID           = { provider = "protonpass", value = "pass://env-dlt/bikeshare/member-id" }
BIKESHARE__AUTHORIZATION_TOKEN = { provider = "protonpass", value = "pass://env-dlt/bikeshare/authorization-token" }
GITHUB__ACCESS_TOKEN           = { provider = "protonpass", value = "pass://env-dlt/github/access-token" }
# JSON list of commit author emails that are "mine" (kept out of this public repo)
GITHUB__AUTHOR_EMAILS          = { provider = "protonpass", value = "pass://env-dlt/github/author-emails" }

# Warehouse and Prefect credentials, granted only to tasks that need them.
DESTINATION__POSTGRES__CREDENTIALS__PASSWORD = { provider = "protonpass", value = "pass://env-dlt/postgres-metabase/password" }
PREFECT_API_URL                              = { provider = "protonpass", value = "pass://env-dlt/prefect/api-url" }
PREFECT_API_AUTH_STRING                      = { provider = "protonpass", value = "pass://env-dlt/prefect/api-auth-string" }
# Miroir metadata database (schema miroir_meta in the postgres-miroir CNPG
# cluster, decision 015). In the cluster, flow-run Jobs read the password from
# the CNPG-generated postgres-miroir-app secret; this ProtonPass item holds the
# same app-user password for the operator's laptop (create it from the cluster
# secret after bootstrap). The miroir master key is granted only to tasks that
# decrypt built-in secrets.
MIROIR_METADATA__PASSWORD                     = { provider = "protonpass", value = "pass://env-dlt/miroir/metadata-password" }
MIROIR_SECRET_KEY                            = { provider = "protonpass", value = "pass://env-dlt/miroir/secret-key" }
