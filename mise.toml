min_version = "2026.10.4"   # task secret grants require mise secrets

[tools]
uv = "latest"
"github:protonpass/pass-cli" = "latest"   # Proton Pass CLI (fnox backend)
"github:jdx/fnox" = "latest"              # fetches secrets for explicitly granted tasks

[settings]
experimental = true

[secrets.fnox]

# Shared non-secret defaults. Override machine-specific settings in the
# gitignored mise.local.toml, without changing the machine's mise environments.
# mise grants each task only its listed fnox secrets; nothing enters the shell.
[env]
_.python.venv = {path = ".venv", create = true}
RUNTIME__LOG_LEVEL = "INFO"
RUNTIME__HTTP_SHOW_ERROR_BODY = "true"
LISTENBRAINZ__USERNAME = "Chocoboco"
LISTENBRAINZ__START_DATE = "2019-06-11T09:57:59+0000"
GITHUB__USERNAME = "h-wb"
PREFECT_SERVER_ALLOW_EPHEMERAL_MODE = "false"
PREFECT_LOGGING_EXTRA_LOGGERS = "dlt"
PREFECT_LOGGING_LOG_PRINTS = "true"
DESTINATION__POSTGRES__CREDENTIALS__HOST = "postgres-metabase-rw.automation.svc"
DESTINATION__POSTGRES__CREDENTIALS__PORT = "5432"
DESTINATION__POSTGRES__CREDENTIALS__DATABASE = "metabase"
DESTINATION__POSTGRES__CREDENTIALS__USERNAME = "metabase"
# Miroir's own metadata store (decision 015): schema miroir_meta in the
# postgres-miroir CNPG cluster. The password is a fnox secret (the app user's
# password from the cluster's postgres-miroir-app secret); the URL is composed
# from these parts.
MIROIR_METADATA__HOST = "postgres-miroir-rw.automation.svc"
MIROIR_METADATA__PORT = "5432"
MIROIR_METADATA__DATABASE = "miroir"
MIROIR_METADATA__USERNAME = "miroir"
# Data mounts on the Prefect worker; override for local imports.
BROWSER_HISTORY__DATA_DIR = "/root/.prefect/data/browser"
APPLE_HEALTH__DATA_DIR = "/root/.prefect/data/health"
APPLE_HEALTH__CUTOFF = "2026-06-04"
# The workstation and pod tokens read the `Automation General` vault. Both use this
# repo session (shared by its Paseo worktrees).
PROTON_PASS_SESSION_DIR = "{{env.HOME}}/.local/state/pass-cli/dlt"
PROTON_PASS_AGENT_REASON = "dlt fnox"

[tasks."pass:login"]
extends = "proton-login"
description = "Authenticate the dlt Proton Pass session using dotfiles' global task"
env.PROTON_PASS_LOGIN_SESSION = "dlt"

[tasks.dev]
description = "Serve Miroir with workspace-local SQLite/DuckDB state (no Proton secrets)"
run = "uv run --locked python -m scripts.dev local"

[tasks."dev:infra"]
description = "Serve this checkout against the existing Miroir installation"
depends = ["pass:login"]
secrets = [
  "MIROIR_METADATA__PASSWORD",
  "MIROIR_SECRET_KEY",
  "PREFECT_API_URL",
  "PREFECT_API_AUTH_STRING",
]
run = "uv run --locked python -m scripts.dev infra"

[tasks.deploy]
depends = ["pass:login"]
description = "Deploy all flows to Prefect"
secrets = [
  "DESTINATION__POSTGRES__CREDENTIALS__PASSWORD",
  "PREFECT_API_URL",
  "PREFECT_API_AUTH_STRING",
  "GITHUB__AUTHOR_EMAILS",
  "BIKESHARE__MEMBER_ID",
  "BIKESHARE__AUTHORIZATION_TOKEN",
]
run = "prefect deploy --all --prefect-file prefect.yaml"

# Miroir reconciliation with the cluster's Prefect (decision 013). The local
# miroir.json must match the copy on the NFS export; flow runs read the
# cluster path (MIROIR_PREFECT_CONFIG_PATH), not this file.
[tasks."miroir:deploy"]
depends = ["pass:login"]
description = "Reconcile Prefect deployments with miroir.json (see plan first)"
secrets = [
  "PREFECT_API_URL",
  "PREFECT_API_AUTH_STRING",
  "MIROIR_METADATA__PASSWORD",
]
env = { MIROIR_PREFECT_CONFIG_PATH = "/miroir/data/miroir/miroir.json" }
run = "pipelines-miroir --config miroir.json deployments apply"

[tasks."miroir:refresh"]
depends = ["pass:login"]
description = "Close unverified runs from Prefect's state (crash -> lost, cancel -> cancelled)"
secrets = [
  "PREFECT_API_URL",
  "PREFECT_API_AUTH_STRING",
  "MIROIR_METADATA__PASSWORD",
]
env = { MIROIR_PREFECT_POOL = "miroir-k8s" }
run = "pipelines-miroir --config miroir.json refresh"

[tasks.prefect]
depends = ["pass:login"]
description = "Run the prefect CLI with secrets (e.g. mise run prefect -- deployment ls)"
secrets = ["PREFECT_API_URL", "PREFECT_API_AUTH_STRING"]
run = "prefect"

[tasks.worker]
depends = ["pass:login"]
description = "Start Prefect worker"
secrets = ["PREFECT_API_URL", "PREFECT_API_AUTH_STRING"]
run = "prefect worker start --pool local-pool"

[tasks."run:listenbrainz"]
depends = ["pass:login"]
description = "Run listenbrainz pipeline locally"
secrets = [
  "DESTINATION__POSTGRES__CREDENTIALS__PASSWORD",
  "PREFECT_API_URL",
  "PREFECT_API_AUTH_STRING",
  "GITHUB__AUTHOR_EMAILS",
  "LISTENBRAINZ__ACCESS_TOKEN",
]
run = "python -m src.pipelines.listenbrainz"

[tasks."run:bikeshare"]
depends = ["pass:login"]
description = "Run bikeshare pipeline locally"
secrets = [
  "DESTINATION__POSTGRES__CREDENTIALS__PASSWORD",
  "PREFECT_API_URL",
  "PREFECT_API_AUTH_STRING",
  "GITHUB__AUTHOR_EMAILS",
  "BIKESHARE__MEMBER_ID",
  "BIKESHARE__AUTHORIZATION_TOKEN",
]
run = "python -m src.pipelines.bikeshare"

[tasks."run:github"]
depends = ["pass:login"]
description = "Run github pipeline locally"
secrets = [
  "DESTINATION__POSTGRES__CREDENTIALS__PASSWORD",
  "PREFECT_API_URL",
  "PREFECT_API_AUTH_STRING",
  "GITHUB__AUTHOR_EMAILS",
  "GITHUB__ACCESS_TOKEN",
]
run = "python -m src.pipelines.github"

[tasks."run:browser-history"]
depends = ["pass:login"]
description = "Run browser history pipeline locally"
secrets = [
  "DESTINATION__POSTGRES__CREDENTIALS__PASSWORD",
  "PREFECT_API_URL",
  "PREFECT_API_AUTH_STRING",
  "GITHUB__AUTHOR_EMAILS",
]
run = "python -m src.pipelines.browser_history"

[tasks."run:apple-health"]
depends = ["pass:login"]
description = "Run apple health pipeline locally (uses APPLE_HEALTH__DATA_DIR and APPLE_HEALTH__CUTOFF)"
secrets = [
  "DESTINATION__POSTGRES__CREDENTIALS__PASSWORD",
  "PREFECT_API_URL",
  "PREFECT_API_AUTH_STRING",
  "GITHUB__AUTHOR_EMAILS",
]
run = "python -m src.pipelines.apple_health"

[tasks."run:dbt"]
depends = ["pass:login"]
description = "Build and test the dbt models (needs DESTINATION__POSTGRES__CREDENTIALS__*)"
secrets = ["DESTINATION__POSTGRES__CREDENTIALS__PASSWORD", "GITHUB__AUTHOR_EMAILS"]
run = "dbt build --project-dir dbt --profiles-dir dbt"
