[tools]
uv = "latest"
"github:protonpass/pass-cli" = "latest"   # Proton Pass CLI (fnox backend)
"github:jdx/fnox" = "latest"              # injects secrets from fnox.toml as env vars

# Non-secret config. Local defaults here, prod overrides in mise.prod.toml
# (prod is the default env, see .miserc.toml). Secrets come from fnox.toml:
# every task below runs under `fnox exec`, and FNOX_PROFILE picks the profile.
# `--if-missing error` fails fast instead of running with a secret unset.
[env]
_.python.venv = {path = ".venv", create = true}
RUNTIME__LOG_LEVEL = "DEBUG"
RUNTIME__HTTP_SHOW_ERROR_BODY = "true"
LISTENBRAINZ__USERNAME = "Chocoboco"
LISTENBRAINZ__START_DATE = "2025-10-04"
GITHUB__USERNAME = "h-wb"
BROWSER_HISTORY__DATA_DIR = "{{env.HOME}}/Nextcloud/Hugo/Documents/data/browser"

[tasks.deploy]
description = "Deploy all flows to Prefect"
run = "fnox --if-missing error exec -- prefect deploy --all --prefect-file prefect.yaml"

[tasks.prefect]
description = "Run the prefect CLI with secrets (e.g. mise run prefect -- deployment ls)"
run = "fnox --if-missing error exec -- prefect"

[tasks.worker]
description = "Start Prefect worker"
run = "fnox --if-missing error exec -- prefect worker start --pool local-pool"

[tasks."run:listenbrainz"]
description = "Run listenbrainz pipeline locally"
run = "fnox --if-missing error exec -- python -m src.pipelines.listenbrainz"

[tasks."run:bikeshare"]
description = "Run bikeshare pipeline locally"
run = "fnox --if-missing error exec -- python -m src.pipelines.bikeshare"

[tasks."run:github"]
description = "Run github pipeline locally"
run = "fnox --if-missing error exec -- python -m src.pipelines.github"

[tasks."run:browser-history"]
description = "Run browser history pipeline locally"
run = "fnox --if-missing error exec -- python -m src.pipelines.browser_history"

[tasks."run:apple-health"]
description = "Run apple health pipeline locally (uses APPLE_HEALTH__DATA_DIR and APPLE_HEALTH__CUTOFF)"
run = "fnox --if-missing error exec -- python -m src.pipelines.apple_health"

[tasks."run:dbt"]
description = "Build and test the dbt models (needs DESTINATION__POSTGRES__CREDENTIALS__*)"
run = "fnox --if-missing error exec -- dbt build --project-dir dbt --profiles-dir dbt"
