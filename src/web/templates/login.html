{% extends "base.html" %}
{% set anonymous = true %}
{% block title %}Log in{% endblock %}
{% block body %}
<h1>Log in</h1>
{% if failed %}<p class="error">That token is not valid.</p>{% endif %}
<form method="post" action="/login">
  <label>Mirroir token <input type="password" name="token" autocomplete="current-password" autofocus required></label>
  <button>Log in</button>
</form>
{% endblock %}
